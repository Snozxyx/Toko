name: Build and Release Toko Extension

on:
  push:
    tags:
      - 'v*'
      - 'toko-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v4.2.0)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - uses: oven-sh/setup-bun@v2

      - name: Provider regression tests
        run: bun test tests

      - name: Build extension
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f dist/toko.kai ]; then
            echo "Error: toko.kai not found in dist/"
            exit 1
          fi
          echo "Build successful: toko.kai ($(stat -c%s dist/toko.kai) bytes)"

      - name: Extract version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Toko Extension ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          files: dist/toko.kai
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toko-kai-${{ steps.version.outputs.version }}
          path: dist/toko.kai
          retention-days: 90
