name: Build and Release Toko Extension

on:
  push:
    tags:
      - 'v*'
      - 'toko-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v4.2.0)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f dist/toko.kai ]; then
            echo "Error: toko.kai not found in dist/"
            exit 1
          fi
          echo "Build successful: toko.kai ($(stat -c%s dist/toko.kai) bytes)"

      - name: Extract version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Toko Extension ${{ steps.version.outputs.version }}
          body: |
            ## Toko 4.5.4

            - Prevent manga providers from selecting same-title novels and inflating chapter counts.
            - Check NovelCool reader pages for actual manga panels before accepting a chapter catalog.
            - Improve MangaDex title mapping, multilingual catalog pagination, scanlator labels, and chapter-zero handling.
            - Keep readable MangaDex chapters while excluding empty, external-only, and future releases.

            ### Installation
            1. Download `toko.kai`.
            2. Install in Tatakai via Settings → Extensions → Install from file.
            3. Refresh the manga chapter list in the updated Tatakai app to clear cached results.

            Validation: extension build and manga matching, MangaDex catalog, and mobile novel bundle regression checks passed. Physical mobile-device verification remains pending.
          files: dist/toko.kai
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toko-kai-${{ steps.version.outputs.version }}
          path: dist/toko.kai
          retention-days: 90
