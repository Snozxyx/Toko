name: Build and Release Toko Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v4.2.0)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f dist/toko.kai ]; then
            echo "Error: toko.kai not found in dist/"
            exit 1
          fi
          echo "Build successful: toko.kai ($(stat -c%s dist/toko.kai) bytes)"

      - name: Extract version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Toko Extension ${{ steps.version.outputs.version }}
          body: |
            ## Toko Extension ${{ steps.version.outputs.version }}

            ### Novel support
            - Automatic title search and chapter mapping using AniList titles and aliases.
            - Chapter lists and readable text from 10 novel adapters: Wuxiaworld.com, Webnovel, JustLightNovels, LightNovel.to, NovelFull, NovelFire, NovelBin, NovelBuddy, RoyalRoad, and wuxiaworld.site.
            - Native mobile-compatible HTTP adapters, paginated catalogs, and AJAX chapter discovery.
            - Stricter matching preserves subtitles and sequel numbers to avoid mixing unrelated books.
            - Provider diagnostics report access errors; availability depends on the upstream site. No paid-chapter unlocking is provided.
            - MIT attribution for the adapted webnovel-scraper provider contracts is included in the download.

            ### Installation
            1. Download `toko.kai`
            2. Install in Tatakai via Settings → Extensions → Install from file

            ### Coverage
            - **Stream**: 82 providers — anime, movies, and TV (HLS, MP4, captions, language metadata)
            - **Torrent**: 6 providers — magnet links, `.torrent` files, seeders/leechers
            - **Manga**: 16 providers — chapters, pages, scanlator metadata
            - **Novel**: 10 providers — automatic matching, chapter catalogs, readable text, and diagnostics
          files: dist/toko.kai
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toko-kai-${{ steps.version.outputs.version }}
          path: dist/toko.kai
          retention-days: 90
